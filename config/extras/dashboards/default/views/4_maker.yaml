          name: Current job
          icon: mdi:layers-triple
          icon_color: blue
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_print_progress
          name: Progress
          icon: mdi:progress-clock
          icon_color: amber
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_current_layer
          name: Current layer
          icon: mdi:layers
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_total_layer_count
          name: Total layers
          icon: mdi:layers-outline
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_remaining_time
          name: Time remaining
          icon: mdi:timer-sand
          icon_color: deep-orange
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
    - type: custom:mushroom-title-card
      title: Print temperatures
      subtitle: Nozzle and build plate
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_nozzle_temperature
          name: Nozzle
          icon: mdi:printer-3d-nozzle-heat
          icon_color: deep-orange
          primary_info: name
          secondary_info: state
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_nozzle_target_temperature
          name: Nozzle target
          icon: mdi:thermometer-chevron-up
          icon_color: orange
          primary_info: name
          secondary_info: state
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_bed_temperature
          name: Build plate
          icon: mdi:heat-wave
          icon_color: red
          primary_info: name
          secondary_info: state
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.a1mini_0300ba651400506_bed_target_temperature
          name: Build plate target
          icon: mdi:thermometer-chevron-up
          icon_color: deep-orange
          primary_info: name
          secondary_info: state
          tap_action:
            action: more-info
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: button.a1mini_0300ba651400506_pause
          name: Pause
          icon: mdi:pause
          icon_color: amber
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.a1mini_0300ba651400506_pause
        - type: custom:mushroom-entity-card
          entity: button.a1mini_0300ba651400506_resume
          name: Resume
          icon: mdi:play
          icon_color: green
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.a1mini_0300ba651400506_resume
        - type: custom:mushroom-entity-card
          entity: button.a1mini_0300ba651400506_stop
          name: Stop print
          icon: mdi:stop
          icon_color: red
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.a1mini_0300ba651400506_stop
