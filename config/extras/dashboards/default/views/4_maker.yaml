title: Maker Lab
path: maker
icon: mdi:printer-3d
badges: []
cards:
# - type: custom:auto-entities
#   card:
#     type: entities
#     title: AirGradient One
#   filter:
#     include:
#       - entity_id: "*airgradient*"
#     exclude:
#       - entity_id: switch.bedroom_airgradient_display_blank_page
#   sort:
#     method: name
- type: vertical-stack
  cards:
    - type: custom:mushroom-template-card
      entity: switch.bedroom_airgradient_display_blank_page
      primary: "{{ 'AirGradient Night Mode' if is_state(entity, 'on') else 'AirGradient Day Mode' }}"
      secondary: "{{ 'Blank page enabled' if is_state(entity, 'on') else 'Default page enabled' }}"
      icon: "{{ 'mdi:weather-night' if is_state(entity, 'on') else 'mdi:weather-sunny' }}"
      icon_color: "{{ 'indigo' if is_state(entity, 'on') else 'amber' }}"
      tap_action:
        action: call-service
        service: script.airgradient_toggle_mode
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: sensor.bedroom_airgradient_air_quality_index
      name: Air quality index
      icon: mdi:air-filter
    - type: custom:mushroom-title-card
      title: Indoor climate
      subtitle: Comfort and ventilation
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.airgradient_temperature
          name: Temperature
          icon: mdi:thermometer
          icon_color: deep-orange
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.airgradient_humidity
          name: Humidity
          icon: mdi:water-percent
          icon_color: blue
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.airgradient_senseair_co2_value
          name: CO2
          icon: mdi:molecule-co2
          icon_color: teal
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
    - type: custom:mushroom-title-card
      title: Particulate matter
      subtitle: Particle concentration
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.bedroom_airgradient_particulate_matter_1_0mm_concentration
          name: PM1
          icon: mdi:blur
          icon_color: green
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.airgradient_particulate_matter_2_5mm_concentration
          name: PM2.5
          icon: mdi:blur
          icon_color: orange
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.bedroom_airgradient_particulate_matter_10_0mm_concentration
          name: PM10
          icon: mdi:blur
          icon_color: red
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
    - type: custom:mushroom-title-card
      title: Gas indexes and uptime
      subtitle: VOC, NOx and sensor runtime
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.bedroom_airgradient_voc_index
          name: VOC index
          icon: mdi:air-filter
          icon_color: amber
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.bedroom_airgradient_nox_index
          name: NOx index
          icon: mdi:chemical-weapon
          icon_color: deep-purple
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.airgradient_airgradient_uptime_2
          name: Uptime
          icon: mdi:timer-outline
          icon_color: cyan
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
- type: vertical-stack
  cards:
    - type: custom:bubble-card
      card_type: separator
      name: A1 mini
      icon: mdi:printer-3d
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: switch.a1_mini_power
          name: Printer power
          icon: mdi:power
          icon_color: teal
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: toggle
        - type: custom:mushroom-entity-card
          entity: switch.a1_mini_accesories_power
          name: Accessories
          icon: mdi:power-socket-us
          icon_color: blue
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: toggle
        - type: custom:mushroom-entity-card
          entity: sensor.a1_mini_power_power
          name: Power usage
          icon: mdi:lightning-bolt
          icon_color: amber
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: light.a1mini_0300ba651400506_chamber_light
          name: Printer light
          icon: mdi:lightbulb
          icon_color: amber
          primary_info: name
          secondary_info: state
          layout: vertical
          tap_action:
            action: toggle
    - type: custom:mushroom-entity-card
      entity: switch.a1_mini_cam
      name: Build Plate Camera
      icon: mdi:cctv
      icon_color: blue
      primary_info: name
      secondary_info: state
      tap_action:
        action: toggle
    - type: picture-entity
      entity: camera.a1_mini_cam_live_view
      camera_view: live
      aspect_ratio: "16:9"
      show_name: false
      show_state: false
      tap_action:
        action: none
- type: vertical-stack
  cards:
    - type: custom:bubble-card
      card_type: separator
      name: A1 mini print monitor
      icon: mdi:printer-3d
    - type: grid
      columns: 3
      square: false
      cards:
        - type: custom:mushroom-entity-card
