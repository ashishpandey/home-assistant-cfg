path: bed
title: Bed Rooms
icon: mdi:bed-king-outline
type: sections
max_columns: 3
sections:
- type: grid
  cards:
  - type: vertical-stack
    cards:
      - type: custom:decluttering-card
        template: mushroom_card_container
        variables:
          - cards:
              - type: custom:mushroom-title-card
                title: Bedroom Lights
              - type: horizontal-stack
                cards:
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Full
                      - icon: mdi:bed-king
                      - color: amber
                      - scene: scene.bedroom_bed_full
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Relax
                      - icon: mdi:weather-sunset
                      - color: deep-orange
                      - scene: scene.bedroom_relax
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Blur
                      - icon: mdi:blur
                      - color: indigo
                      - scene: scene.bedroom_blur
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Energize
                      - icon: mdi:weather-sunny
                      - color: yellow
                      - scene: scene.bedroom_energize
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Bright
                      - icon: mdi:brightness-7
                      - color: light-blue
                      - scene: scene.bedroom_bright
              - type: horizontal-stack
                cards:
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Concentrate
                      - icon: mdi:target
                      - color: blue
                      - scene: scene.bedroom_concentrate
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Nightlight
                      - icon: mdi:weather-night
                      - color: deep-purple
                      - scene: scene.bedroom_nightlight
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Read
                      - icon: mdi:book-open-page-variant
                      - color: green
                      - scene: scene.bedroom_read
                  - type: custom:decluttering-card
                    template: mushroom_scene
                    variables:
                      - name: Dimmed
                      - icon: mdi:brightness-5
                      - color: orange
                      - scene: scene.bedroom_dimmed

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.bedroom_cove
            name: Bedroom Cove
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-light-card
            entity: light.candle
            name: Candle
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info

      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: group.bedroom_spots
        name: Bedroom Spots
        icon: mdi:lightbulb-group
        button_action:
          tap_action:
            action: toggle
          hold_action:
            action: none
          double_tap_action:
            action: none
        tap_action:
          action: toggle
        hold_action:
          action: none
        double_tap_action:
          action: none
        sub_button:
          - entity: switch.bedroom_spots_left
            icon: mdi:car-light-high
            show_name: false
            show_icon: true
            show_state: false
            show_background: false
            state_background: false
            tap_action:
              action: toggle
            hold_action:
              action: none
            double_tap_action:
              action: none
          - entity: switch.bedroom_spots_right
            icon: mdi:car-light-high
            show_name: false
            show_icon: true
            show_state: false
            show_background: false
            state_background: false
            tap_action:
              action: toggle
            hold_action:
              action: none
            double_tap_action:
              action: none
        modules:
          - home-assistant-default
        styles: |
          ha-card {
            --bubble-button-border-radius: var(--ha-card-border-radius, 12px) !important;
            background: var(--ha-card-background, var(--card-background-color)) !important;
            border: var(--ha-card-border, 1px solid var(--divider-color)) !important;
            border-radius: var(--ha-card-border-radius, 12px) !important;
            overflow: hidden !important;
          }
          .bubble-button-card-container {
            background: transparent !important;
            border-radius: inherit !important;
          }
          .bubble-button-background {
            opacity: 0 !important;
          }
          .bubble-icon {
            color: ${hass.states['group.bedroom_spots']?.state === 'on' ? 'var(--state-switch-on-color, var(--accent-color))' : 'var(--state-inactive-color, var(--secondary-text-color))'} !important;
          }
          .bubble-sub-button-1 > ha-icon {
            transform: rotate(90deg);
            color: ${hass.states['switch.bedroom_spots_left']?.state === 'on' ? 'var(--state-switch-on-color, var(--accent-color))' : 'var(--state-inactive-color, var(--secondary-text-color))'} !important;
          }
          .bubble-sub-button-2 > ha-icon {
            transform: rotate(-90deg);
            color: ${hass.states['switch.bedroom_spots_right']?.state === 'on' ? 'var(--state-switch-on-color, var(--accent-color))' : 'var(--state-inactive-color, var(--secondary-text-color))'} !important;
          }

- type: grid
  cards:
  - type: vertical-stack
    cards:
      - type: tile
        entity: fan.br_fan
        name: Bedroom Fan
        features:
          - type: fan-speed
      - type: custom:decluttering-card
        template: better_thermostat_with_status
        variables:
          - entity: climate.cooler
          - name: Bedroom AC
          - features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
          - status_entity: binary_sensor.cooler_status
          - status_prefix: ""

- type: grid
  cards:
  - type: vertical-stack
    cards:
      - type: entities
        entities:
          - light.guest_room_fan
          - light.diya
        title: Guest Room
        show_header_toggle: true
      - type: entities
        entities:
          - light.bedroom
          - light.guest_room
        title: light
