mushroom_card_container:
  card:
    type: custom:mod-card
    card:
      type: vertical-stack
      cards: '[[cards]]'
    card_mod:
      style: |
        ha-card {
          background: var(--ha-card-background, var(--card-background-color));
          border: var(--ha-card-border, 1px solid var(--divider-color));
          border-radius: var(--ha-card-border-radius, 12px);
          overflow: hidden;
        }

mushroom_scene:
  card:
    type: custom:mushroom-template-card
    primary: '[[name]]'
    icon: '[[icon]]'
    icon_color: '[[color]]'
    layout: vertical
    tap_action:
      action: call-service
      service: scene.turn_on
      target:
        entity_id: '[[scene]]'
    card_mod:
      style: |
        ha-card {
          background: transparent;
          border: 0;
          box-shadow: none;
        }